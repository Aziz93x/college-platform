# The production stack: the same file runs on the laptop (Step 41) and on the server (Section K).
# Values come from docker/.env, which pnpm local:up writes from docker/.env.example. App, worker and
# PostgreSQL sit on a network with no route out, and only Caddy publishes ports (ADR-0008).
name: college
x-worker-build: &worker-build
  build: { context: .., dockerfile: docker/Dockerfile, target: worker }
  image: college-worker
x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV:-production}
  APP_URL: ${APP_URL}
  AUTH_SECRET: ${AUTH_SECRET}
services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      DEFAULT_SNI: ${DEFAULT_SNI:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge, internal]
    depends_on: [app]
  app:
    build: { context: .., dockerfile: docker/Dockerfile, target: app }
    image: college-app
    restart: unless-stopped
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Ready once the database and the queue answer (/readyz); docker compose up --wait waits for it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 24
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *worker-build
    restart: unless-stopped
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
  # Once per start, as the tables' owner: migrations, the app's role and the base seed. pnpm local:run
  # runs admin:create and seed:demo in it too, since PostgreSQL publishes no port.
  migrate:
    <<: *worker-build
    environment:
      <<: *runtime-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgres://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_COLLEGE_NAME: ${SEED_COLLEGE_NAME}
      SEED_COLLEGE_SHORT_NAME: ${SEED_COLLEGE_SHORT_NAME}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_TOTP_SECRET: ${DEMO_TOTP_SECRET:-}
    command: ["sh", "-c", "node db/migrate.ts && node db/seed/base.ts"]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [internal]
  # Daily logical dump into the backups volume. Step 42 replaces it with encrypted WAL-G and restic backups.
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes: [backups:/backups]
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc -f /backups/db-$$(date +%Y%m%d).dump && find /backups -name 'db-*.dump' -mtime +14 -delete; sleep 86400; done"]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
  # pnpm local:share: a temporary HTTPS address for a phone, on demo data only. It reaches Caddy's
  # unpublished tunnel entrance, so the stack's own network keeps no route out.
  share:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [share]
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:8080"]
    networks: [edge]
    depends_on: [caddy]
networks:
  internal: { internal: true }
  edge: {}
volumes:
  pgdata:
  # One certificate authority for the production-like and the demo stack, so a phone trusts one root.
  caddy_data: { name: college_caddy_data }
  backups:
