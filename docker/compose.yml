# The production stack: the same file runs on the laptop (Step 41) and on the server (Section K).
# Values come from docker/.env (see docker/.env.example).
name: college
services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
  app:
    build: { context: .., dockerfile: docker/Dockerfile, target: app }
    image: college-app
    restart: unless-stopped
    environment: &runtime-env
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SMTP_URL: ${SMTP_URL}
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    image: college-worker
    restart: unless-stopped
    environment: *runtime-env
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  # Daily logical dump into the backups volume. Step 42 replaces it with encrypted WAL-G and restic backups.
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes: [backups:/backups]
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc -f /backups/db-$$(date +%Y%m%d).dump && find /backups -name 'db-*.dump' -mtime +14 -delete; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
  caddy_data:
  backups:
