name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: check:all, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: college
          POSTGRES_PASSWORD: college
          POSTGRES_DB: college
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U college -d college"
          --health-interval 5s --health-retries 10
    env:
      APP_ENV: local
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://college:college@localhost:5432/college
      SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fonts and brand assets stay out of git (ADR-0004); next/font reads the fonts at build time.
      - run: pnpm identity:sync
      - name: tokens.css matches the pinned identity commit
        run: git diff --exit-code -- src/styles/tokens.css src/styles/token-names.ts
      - run: pnpm check:all
      - run: pnpm check:unused
      - name: Migrations match the schemas
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            echo "A schema.ts changed without pnpm db:generate; commit the reviewed SQL:"
            git status --porcelain -- db/migrations
            exit 1
          fi
      # The Docker build has no environment or database, so the build must not read either: empty
      # values make any build-time read fail here, not only in the images job.
      - run: pnpm build
        env:
          APP_URL: ""
          DATABASE_URL: ""
          SMTP_URL: ""
      # The standalone server serves only the static files copied next to it, as in docker/Dockerfile.
      - run: cp -r .next/static .next/standalone/.next/static
      - run: cp -r public .next/standalone/public
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm seed:demo
      # The debug log names the web server command, so the log shows which build was tested.
      - run: pnpm test:e2e
        env:
          DEBUG: pw:webserver
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      # A missing visual baseline makes Playwright write one and fail without a retry. Only those
      # new files go up; the baselines job commits them to the pull request.
      - name: Collect new visual baselines
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/visual-baselines"
          git ls-files -z --others --exclude-standard -- ':(glob)e2e/**/*-snapshots/*.png' \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/visual-baselines"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/visual-baselines/
          if-no-files-found: ignore
          retention-days: 7

  # Visual baselines come from this runner's Chromium, never from a laptop. This job adds the ones
  # the checks job wrote and never replaces a committed one: to update a baseline, delete it and
  # push. A push made with this token starts no workflow, so push again to test against them.
  # It runs only for pull requests from this repository and is not a required check.
  baselines:
    name: Commit new visual baselines
    needs: checks
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.head_ref }}
      # The checks job may have failed for another reason and uploaded no baseline.
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/visual-baselines
      - name: Commit the baselines that do not exist yet
        if: steps.download.outcome == 'success'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          added=()
          cd "$RUNNER_TEMP/visual-baselines"
          while IFS= read -r -d '' file; do
            file=${file#./}
            case "$file" in
              e2e/*-snapshots/*.png) ;;
              *) echo "Skipped $file: not a visual baseline"; continue ;;
            esac
            if [ -e "$GITHUB_WORKSPACE/$file" ]; then
              echo "Kept $file: it exists already"; continue
            fi
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$file")"
            cp "$file" "$GITHUB_WORKSPACE/$file"
            added+=("$file")
          done < <(find . -type f -print0)
          cd "$GITHUB_WORKSPACE"
          if [ "${#added[@]}" -eq 0 ]; then echo "No new baseline."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -- "${added[@]}"
          git commit -m "test: add visual baselines from CI" -m "$(printf '%s\n' "${added[@]}")"
          git push origin "HEAD:$BRANCH"

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build app
        run: docker buildx build --load -f docker/Dockerfile --target app -t college-app .
      - name: Build worker
        run: docker buildx build --load -f docker/Dockerfile --target worker -t college-worker .
      - name: App image is under 300 MB
        run: |
          size=$(docker image inspect college-app --format '{{.Size}}')
          echo "app image: $((size / 1000000)) MB"
          test "$size" -lt 300000000
      # Exit 1 alone is not proof: Node also exits 1 when the image lacks a module. The env check names the variable.
      - name: Both images refuse an invalid environment
        run: |
          for image in college-app college-worker; do
            status=0
            output=$(timeout 60 docker run --rm -e DATABASE_URL=invalid "$image" 2>&1) || status=$?
            echo "$output"
            if [ "$status" -ne 1 ] || ! grep -q "DATABASE_URL" <<< "$output"; then
              echo "$image did not refuse an invalid environment (exit $status)"; exit 1
            fi
          done
