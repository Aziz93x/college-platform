name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: check:all, build and smoke test
    # The visual baselines are pixels from this runner: ubuntu-latest moves between Ubuntu releases,
    # whose fonts draw text differently, so this job names its release. Moving to a new one means
    # taking the baselines again (e2e/design.visual.spec.ts).
    runs-on: ubuntu-24.04
    # The job takes about 14 minutes. A slow package mirror once made the browser install's apt
    # download alone take up to 14 more, so the job gets 30 minutes, as the other jobs do.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: college
          POSTGRES_PASSWORD: college
          POSTGRES_DB: college
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U college -d college"
          --health-interval 5s --health-retries 10
    env:
      APP_ENV: local
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://college:college@localhost:5432/college
      AUTH_SECRET: ci-only-value-that-signs-cookies-in-tests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fonts and brand assets stay out of git (ADR-0004); next/font reads the fonts at build time.
      - run: pnpm identity:sync
      - name: tokens.css matches the pinned identity commit
        run: git diff --exit-code -- src/styles/tokens.css src/styles/token-names.ts
      - run: pnpm check:all
      - run: pnpm check:unused
      - name: Migrations match the schemas
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            echo "A schema.ts changed without pnpm db:generate; commit the reviewed SQL:"
            git status --porcelain -- db/migrations
            exit 1
          fi
      # The Docker build has no environment or database, so the build must not read either: empty
      # values make any build-time read fail here, not only in the images job.
      - run: pnpm build
        env:
          APP_URL: ""
          DATABASE_URL: ""
          AUTH_SECRET: ""
      # The standalone server serves only the static files copied next to it, as in docker/Dockerfile.
      - run: cp -r .next/static .next/standalone/.next/static
      - run: cp -r public .next/standalone/public
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm seed:demo
      # The debug log names the web server command, so the log shows which build was tested.
      - run: pnpm test:e2e
        env:
          DEBUG: pw:webserver
      # The shell on phone emulation (docs/PLAN.md section 4): performance 95 or more and accessibility
      # 100. The best of three runs counts, so a freshly started server's first answers do not. The
      # throttling is applied to the real load, not simulated (ADR-0001, amendment for Step 5).
      - run: pnpm lighthouse
        env:
          HOSTNAME: localhost
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: .lighthouseci/
          # The reports' folder starts with a dot, which the action skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      # A missing visual baseline makes Playwright write one and fail without a retry. Only those
      # new files go up, and they come from this runner's Chromium, never from a laptop: commit them
      # by hand (gh run download <run> -n visual-baselines), after checking each one.
      - name: Collect new visual baselines
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/visual-baselines"
          git ls-files -z --others --exclude-standard -- ':(glob)e2e/**/*-snapshots/*.png' \
            | xargs -0 -r cp --parents -t "$RUNNER_TEMP/visual-baselines"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/visual-baselines/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build app
        run: docker buildx build --load -f docker/Dockerfile --target app -t college-app .
      - name: Build worker
        run: docker buildx build --load -f docker/Dockerfile --target worker -t college-worker .
      - name: App image is under 300 MB
        run: |
          size=$(docker image inspect college-app --format '{{.Size}}')
          echo "app image: $((size / 1000000)) MB"
          test "$size" -lt 300000000
      # Exit 1 alone is not proof: Node also exits 1 when the image lacks a module. The env check names the variable.
      - name: Both images refuse an invalid environment
        run: |
          for image in college-app college-worker; do
            status=0
            output=$(timeout 60 docker run --rm -e DATABASE_URL=invalid "$image" 2>&1) || status=$?
            echo "$output"
            if [ "$status" -ne 1 ] || ! grep -q "DATABASE_URL" <<< "$output"; then
              echo "$image did not refuse an invalid environment (exit $status)"; exit 1
            fi
          done

  # The production images on a network with no route out (ADR-0008, Step 41): built, saved with
  # their checksums and removed, then started from those archives with no registry pull, as approved
  # media would bring them to a server inside the college. A request the page makes outside the app's
  # origin fails its test, because this runner's browser still reaches the internet.
  stack:
    name: Production stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the images, save them with their checksums and remove them
        run: |
          compose="docker compose -f docker/compose.yml --env-file docker/.env.example"
          $compose build
          $compose pull caddy postgres
          mkdir -p "$RUNNER_TEMP/images"
          images=$($compose config --images | sort -u)
          docker save -o "$RUNNER_TEMP/images/images.tar" $images
          (cd "$RUNNER_TEMP/images" && sha256sum images.tar > SHA256SUMS)
          docker image rm $images
      - name: Start the demo stack from the archives
        run: pnpm local:up --demo --images "$RUNNER_TEMP/images"
      - name: Only Caddy publishes ports, and the stack has no route out
        run: |
          published=$(docker ps --filter label=com.docker.compose.project=college-demo --format '{{.Names}} {{.Ports}}' | grep -- '->')
          echo "$published"
          test "$(wc -l <<< "$published")" -eq 1 && grep -q caddy <<< "$published"
          docker compose -p college-demo -f docker/compose.yml --env-file docker/.env exec -T worker \
            node -e "fetch('https://github.com', { signal: AbortSignal.timeout(5000) }).then(() => process.exit(1), () => console.log('no route out'))"
      - name: The worker's Chromium prints an Arabic page to PDF on that network
        run: docker compose -p college-demo -f docker/compose.yml --env-file docker/.env exec -T worker node worker/print-check.ts
      # WebKit for the safari project (playwright.config.ts), which runs here because the stack serves
      # HTTPS: WebKit keeps no Secure cookie over plain http, and the session cookie is Secure everywhere.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: The end-to-end smoke against Caddy
        run: pnpm exec playwright test --config e2e/stack.config.ts
        env:
          E2E_WEBKIT: "1"
      - name: The stack comes back by itself after Docker restarts
        run: |
          sudo systemctl restart docker
          for attempt in $(seq 1 60); do
            curl -sfk -o /dev/null https://localhost/readyz && echo "ready after restart" && exit 0
            sleep 2
          done
          docker ps -a
          exit 1
      # The owner's first run (docs/ops/local.md): the production-like stack from the same archives,
      # its first admin from admin:create, and that admin's temporary password through the change and
      # the two-factor setup to Today. The password is masked before anything could print it.
      - name: The first admin's first run on the production-like stack
        run: |
          pnpm local:down
          pnpm local:up --images "$RUNNER_TEMP/images"
          output=$(pnpm local:run admin:create --name "First Admin" --email first.admin@college.example --employee-number 100001)
          password=$(sed -n 's/^Temporary password, shown only now: //p' <<< "$output")
          test -n "$password"
          echo "::add-mask::$password"
          FIRST_ADMIN_PASSWORD="$password" FIRST_ADMIN_EMPLOYEE_NUMBER=100001 \
            pnpm exec playwright test --config e2e/first-run.config.ts
      - if: failure()
        run: |
          for project in college-demo college; do
            docker compose -p "$project" -f docker/compose.yml --env-file docker/.env logs --no-color --tail 200
          done
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack-traces
          path: |
            test-results/stack/
            test-results/first-run/
          retention-days: 14
