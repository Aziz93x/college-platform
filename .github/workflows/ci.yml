name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: check:all, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: college
          POSTGRES_PASSWORD: college
          POSTGRES_DB: college
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U college -d college"
          --health-interval 5s --health-retries 10
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://college:college@localhost:5432/college
      SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:all
      - run: pnpm check:unused
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build app
        run: docker buildx build --load -f docker/Dockerfile --target app -t college-app .
      - name: Build worker
        run: docker buildx build --load -f docker/Dockerfile --target worker -t college-worker .
      - name: App image is under 300 MB
        run: |
          size=$(docker image inspect college-app --format '{{.Size}}')
          echo "app image: $((size / 1000000)) MB"
          test "$size" -lt 300000000
      - name: Both images refuse an invalid environment
        run: |
          for image in college-app college-worker; do
            status=0
            timeout 60 docker run --rm -e DATABASE_URL=invalid "$image" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "$image did not refuse an invalid environment (exit $status)"; exit 1
            fi
          done
